---
- name: Deploy Click counter app
  hosts: all
  tasks:
    - name: Run Redis container
      community.docker.docker_container:
        name: redis
        image: redis:alpine
        state: started
        restart_policy: always

    - name: Run Click Counter container
      community.docker.docker_container:
        name: clickcounter
        image: kodekloud/click-counter
        state: started
        restart_policy: always
        ports:
          - "8085:5000"
